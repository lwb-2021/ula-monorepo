[package]
name = "ula-tui"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29.0", features = ["event-stream"] }
env_logger = "0.11.11"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
log = "0.4.34"
ratatui = { version = "0.30.2", features = [
    "unstable-rendered-line-info",
    "scrolling-regions",
] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "net",
] }
tokio-util = { version = "0.7.19", features = ["codec"] }
tui-input = "0.15.4"
ula-protocol = { path = "../ula-protocol" }
