[package]
name = "ula-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
arc-swap = { version = "1.9.2", features = ["serde"] }
async-trait = "0.1.92"
asynchronous-codec = "0.7.0"
dirs = "6.0.0"
env_logger = { version = "0.11.11", default-features = false, features = [
    "auto-color",
    "humantime",
] }
eyre = "0.6.14"
isahc = { version = "2.0.1", default-features = false, features = [
    "http2",
    "native-tls",
] }
log = "0.4.33"
once_cell = "1.21.4"
rpds = { version = "1.2.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smol = "2.0.2"
tap = "1.0.1"
thiserror = "2.0.21"
toml = "1.1.6"


ula-protocol = { path = "../ula-protocol" }
