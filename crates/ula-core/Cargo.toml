[package]
name = "ula-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
arc-swap = { version = "1.9.2", features = ["serde"] }
async-notify = "0.3.4"
async-trait = "0.1.92"
asynchronous-codec = "0.7.0"
backon = { version = "1.6.0", default-features = false }
color-eyre = { version = "0.6.5", default-features = false }
dirs = "6.0.0"
env_logger = { version = "0.11.11", default-features = false, features = [
    "auto-color",
    "humantime",
] }
eyre = { version = "0.6.14", default-features = false }
isahc = { version = "2.0.1", default-features = false, features = [
    "http2",
    "native-tls",
] }
log = "0.4.33"
noyalib = "0.0.18"
once_cell = "1.21.4"
parking_lot = { version = "0.12.5", features = ["serde"] }
rpds = { version = "1.2.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smol = "2.0.2"
tap = "1.0.1"
tempfile = "3.27.0"
thiserror = "2.0.21"


ula-protocol = { path = "../ula-protocol" }
